<fieldset class="grid min-w-0 grid-cols-1 gap-3 md:grid-cols-2">
  <legend class="sr-only">{{ 'contracts.form.vehicleRates.title' | translate }}</legend>
  <label class="pt-choice">
    <input
      type="radio"
      name="vehicle-rates"
      [checked]="choice() === 'no'"
      (click)="pickNo()"
      (keydown)="keys.down($event)"
      (keydown.space)="keys.confirm($event); pickNo()"
      (keydown.enter)="keys.confirm($event); pickNo()"
      (keyup)="keys.up($event)"
    />
    <span>
      <strong>{{ 'contracts.form.vehicleRates.no.title' | translate }}</strong>
      <span class="pt-choice__hint">{{ 'contracts.form.vehicleRates.no.hint' | translate }}</span>
    </span>
  </label>
  <label class="pt-choice">
    <input
      type="radio"
      name="vehicle-rates"
      [checked]="choice() === 'yes'"
      (click)="pickYes()"
      (keydown)="keys.down($event)"
      (keydown.space)="keys.confirm($event); pickYes()"
      (keydown.enter)="keys.confirm($event); pickYes()"
      (keyup)="keys.up($event)"
    />
    <span>
      <strong>{{ 'contracts.form.vehicleRates.yes.title' | translate }}</strong>
      <span class="pt-choice__hint">{{ 'contracts.form.vehicleRates.yes.hint' | translate }}</span>
    </span>
  </label>
</fieldset>

@if (choice() === 'yes') {
  @if (rows().length > 0) {
    <app-contract-rate-rows
      [rows]="rows()"
      (edit)="edit($event)"
      (removed)="remove($event)"
      (focusAdd)="focusAdd()"
    />
  }
  @if (notice(); as notice) {
    <span class="pt-field__error" role="alert">{{ notice | translate }}</span>
  }
  <div class="flex flex-wrap gap-2">
    <button type="button" class="pt-btn pt-btn--sm" data-add (click)="add()">
      <app-icon name="plus" size="sm" /> {{ 'contracts.form.vehicleRates.add' | translate }}
    </button>
    <button type="button" class="pt-btn pt-btn--primary pt-btn--sm" (click)="confirm()">
      {{ 'contracts.form.vehicleRates.confirm' | translate }}
    </button>
  </div>
}
@if (cancellable()) {
  <div>
    <button type="button" class="pt-btn pt-btn--sm" (click)="cancelled.emit()">
      {{ 'contracts.form.cancelModify' | translate }}
    </button>
  </div>
}
<app-contract-keys [byButton]="choice() === 'yes'" [cancellable]="cancellable()" />
@if (dialog(); as state) {
  <app-contract-rate-dialog
    [editing]="state.entry !== null"
    [line]="line()"
    icon="truck"
    [night]="night()"
    [mode]="mode()"
    [subjects]="subjects()"
    [rate]="state.entry?.rate ?? null"
    [minimum]="state.entry?.minimum ?? null"
    (confirmed)="onConfirmed($event)"
    (cancelled)="dialog.set(null)"
  />
}
