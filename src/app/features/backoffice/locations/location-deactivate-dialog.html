<app-dialog
  icon="alert"
  tone="danger"
  [title]="'locations.deactivate.title' | translate: { label: label() }"
  [busy]="facade.deactivating()"
  (closeRequested)="close()"
>
  @if (notice(); as notice) {
    <app-notice class="mb-3" [notice]="notice" />
  }
  <p>{{ 'locations.deactivate.text' | translate }}</p>
  <button
    actions
    #cancel
    type="button"
    class="pt-btn pt-btn--outline"
    [disabled]="facade.deactivating()"
    (click)="close()"
  >
    {{ 'common.actions.cancel' | translate }}
  </button>
  <button
    actions
    type="button"
    class="pt-btn pt-btn--danger"
    [disabled]="facade.deactivating()"
    (click)="deactivate()"
  >
    {{
      (facade.deactivating()
        ? 'locations.deactivate.submit.pending'
        : 'locations.deactivate.submit.idle'
      ) | translate
    }}
  </button>
</app-dialog>
